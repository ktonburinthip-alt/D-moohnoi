<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>กระต่ายโมจิทายภาพ</title>

  <style>
    :root {
      --pink: #ff83ad;
      --pink-dark: #e75688;
      --purple: #7155b5;
      --ink: #4b3c61;
      --green: #c9f4c8;
      --cream: #fffdf7;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Tahoma, "Noto Sans Thai", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 12%, #fff 0 3%, transparent 3.5%),
        radial-gradient(circle at 88% 17%, #fff 0 4%, transparent 4.5%),
        linear-gradient(#aee8ff 0%, #dff8ff 44%, #b9e992 45%, #8bd06d 100%);
      overflow-x: hidden;
      touch-action: manipulation;
    }

    .game {
      width: min(900px, 100%);
      min-height: 100vh;
      margin: auto;
      padding: max(18px, env(safe-area-inset-top)) 20px max(28px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .topbar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      font-size: clamp(22px, 5vw, 35px);
      color: var(--purple);
      text-shadow: 0 2px white;
    }

    .score {
      padding: 10px 16px;
      border: 3px solid white;
      border-radius: 999px;
      background: #ffffffdc;
      box-shadow: 0 4px #80b878;
      font-size: clamp(17px, 3.5vw, 22px);
      font-weight: bold;
      white-space: nowrap;
    }

    .hero {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 6px 0 16px;
    }

    .bunny {
      font-size: 82px;
      animation: hop 1.3s ease-in-out infinite;
    }

    @keyframes hop {
      50% {
        transform: translateY(-9px) rotate(-4deg);
      }
    }

    .speech {
      max-width: 530px;
      padding: 14px 18px;
      border: 3px solid #f6bdd2;
      border-radius: 24px;
      background: white;
      box-shadow: 0 5px #f1a7bf;
      text-align: center;
      font-size: clamp(17px, 3.5vw, 22px);
      font-weight: bold;
    }

    .card {
      width: 100%;
      padding: clamp(20px, 4vw, 34px);
      border: 4px solid white;
      border-radius: 30px;
      background: var(--cream);
      box-shadow: 0 8px #77b66d, 0 14px 25px #477c5550;
      text-align: center;
    }

    .level {
      display: inline-block;
      margin-bottom: 12px;
      padding: 7px 16px;
      border-radius: 999px;
      background: #eee7ff;
      color: var(--purple);
      font-weight: bold;
    }

    #question {
      margin: 0 0 13px;
      font-size: clamp(25px, 5vw, 37px);
      line-height: 1.4;
    }

    .picture {
      width: min(190px, 46vw);
      aspect-ratio: 1;
      margin: 0 auto 20px;
      display: grid;
      place-items: center;
      border: 5px solid #f5c9d8;
      border-radius: 30px;
      background: linear-gradient(135deg, #fff 0%, #fff1f6 100%);
      box-shadow: 0 6px #edb3c9;
      font-size: clamp(80px, 18vw, 140px);
      overflow: hidden;
    }

    .answers {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .answer,
    .next,
    .restart {
      border: 0;
      color: var(--ink);
      font-family: inherit;
      font-weight: bold;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .answer {
      min-height: 78px;
      padding: 12px;
      border-radius: 22px;
      background: #fff0f5;
      box-shadow: 0 6px #eaa5be;
      font-size: clamp(20px, 4vw, 29px);
    }

    .answer:active,
    .next:active,
    .restart:active {
      transform: translateY(5px);
      box-shadow: 0 1px;
    }

    .answer.correct {
      background: var(--green);
      box-shadow: 0 6px #67bc70;
    }

    .answer.wrong {
      background: #ffd2d7;
      box-shadow: 0 6px #ed7886;
    }

    .answer:disabled {
      cursor: default;
    }

    .message {
      min-height: 36px;
      margin: 18px 0 0;
      font-size: clamp(18px, 3.5vw, 25px);
      font-weight: bold;
    }

    .next,
    .restart {
      margin-top: 14px;
      padding: 14px 27px;
      border-radius: 999px;
      color: white;
      font-size: 21px;
    }

    .next {
      display: none;
      background: var(--pink);
      box-shadow: 0 6px var(--pink-dark);
    }

    .result {
      display: none;
    }

    .result h2 {
      margin: 6px 0;
      color: var(--pink-dark);
      font-size: clamp(34px, 7vw, 52px);
    }

    .result p {
      font-size: clamp(20px, 4vw, 28px);
      font-weight: bold;
    }

    .restart {
      display: inline-block;
      background: var(--purple);
      box-shadow: 0 6px #49378c;
    }

    .sparkle {
      position: fixed;
      z-index: 10;
      pointer-events: none;
      animation: sparkle-fall 1.2s ease-out forwards;
    }

    @keyframes sparkle-fall {
      from {
        transform: translateY(-20px) rotate(0);
        opacity: 1;
      }

      to {
        transform: translateY(180px) rotate(360deg);
        opacity: 0;
      }
    }

    @media (max-width: 560px) {
      .hero {
        gap: 0;
      }

      .bunny {
        font-size: 62px;
      }

      .answers {
        grid-template-columns: 1fr;
      }

      .answer {
        min-height: 64px;
      }
    }
  </style>
</head>

<body>
  <main class="game">
    <div class="topbar">
      <h1>🐰 โมจิทายภาพ</h1>
      <div class="score">⭐ <span id="score">0</span> / 7</div>
    </div>

    <div class="hero">
      <div class="bunny">🐰</div>
      <div class="speech" id="speech">สวัสดีจ้ะ! เลือกคำให้ตรงกับภาพนะ</div>
    </div>

    <section class="card" id="quizCard">
      <div class="level" id="level">ข้อ 1 จาก 7</div>
      <h2 id="question">ภาพนี้คืออะไรเอ่ย?</h2>
      <div class="picture" id="picture">🍆</div>
      <div class="answers" id="answers"></div>
      <div class="message" id="message"></div>
      <button class="next" id="nextButton">ข้อต่อไป ➜</button>
    </section>

    <section class="card result" id="result">
      <div style="font-size: 90px;">🎁⭐🐰</div>
      <h2>เก่งมากเลย!</h2>
      <p id="resultText"></p>
      <p>โมจิภูมิใจในตัวหนูมาก ๆ</p>
      <button class="restart" onclick="restartGame()">เล่นอีกครั้ง 🔄</button>
    </section>
  </main>

  <script>
    const questions = [
      {
        picture: "🍆",
        question: "ภาพนี้คืออะไรเอ่ย?",
        choices: ["แตงกวา", "ฟักทอง", "มะเขือ"],
        answer: 2
      },
      {
        picture: "banana-leaf",
        question: "ภาพนี้คืออะไรเอ่ย?",
        choices: ["ใบตอง", "ต้นกล้วย", "หัวปลี"],
        answer: 0
      },
      {
        picture: "👔",
        question: "ภาพนี้คืออะไรเอ่ย?",
        choices: ["กางเกง", "เสื้อเชิ้ต", "กระโปรง"],
        answer: 1
      },
      {
        picture: "🍌",
        question: "ภาพนี้คืออะไรเอ่ย?",
        choices: ["ส้ม", "องุ่น", "กล้วย"],
        answer: 2
      },
      {
        picture: "🥁",
        question: "สะกดคำจากภาพให้ถูกต้อง",
        choices: ["กลอง", "กรอง", "กอง"],
        answer: 0
      },
      {
        picture: "☁️",
        question: "สะกดคำจากภาพให้ถูกต้อง",
        choices: ["เมก", "เมฆ", "เมม"],
        answer: 1
      },
      {
        picture: "incense",
        question: "สะกดคำจากภาพให้ถูกต้อง",
        choices: ["ธูพ", "ธูป", "ธูบ"],
        answer: 1
      }
    ];

    let current = 0;
    let score = 0;
    let answered = false;

    const pictureEl = document.getElementById("picture");
    const questionEl = document.getElementById("question");
    const answersEl = document.getElementById("answers");
    const levelEl = document.getElementById("level");
    const scoreEl = document.getElementById("score");
    const messageEl = document.getElementById("message");
    const speechEl = document.getElementById("speech");
    const nextButton = document.getElementById("nextButton");

    function getPicture(type) {
      const pictures = {
        "🍆": "🍆",
        "👔": "👔",
        "🍌": "🍌",
        "🥁": "🥁",
        "☁️": "☁️",

        "banana-leaf": `
          <svg viewBox="0 0 220 260" width="165" height="190" aria-label="ใบตอง">
            <defs>
              <linearGradient id="leafLeft" x1="0" x2="1">
                <stop offset="0%" stop-color="#347f2e"/>
                <stop offset="100%" stop-color="#72b94d"/>
              </linearGradient>
              <linearGradient id="leafRight" x1="0" x2="1">
                <stop offset="0%" stop-color="#82c85a"/>
                <stop offset="100%" stop-color="#a7d86b"/>
              </linearGradient>
            </defs>

            <path
              d="M109 236 C76 223 31 190 25 142 C19 92 47 38 108 12 L109 236 Z"
              fill="url(#leafLeft)"
              stroke="#357f32"
              stroke-width="5"
            />

            <path
              d="M111 236 C151 222 192 183 196 133 C200 83 168 34 112 12 L111 236 Z"
              fill="url(#leafRight)"
              stroke="#357f32"
              stroke-width="5"
            />

            <path
              d="M109 251 L111 15"
              stroke="#4c9637"
              stroke-width="12"
              stroke-linecap="round"
            />

            <path
              d="M109 246 L111 17"
              stroke="#b2e77f"
              stroke-width="3"
              stroke-linecap="round"
              opacity="0.9"
            />

            <g stroke="#2f762e" stroke-width="3.2" stroke-linecap="round" opacity="0.9">
              <path d="M105 35 L72 27"/>
              <path d="M105 48 L58 38"/>
              <path d="M105 62 L47 49"/>
              <path d="M105 76 L39 63"/>
              <path d="M105 90 L34 79"/>
              <path d="M105 105 L31 96"/>
              <path d="M105 120 L29 114"/>
              <path d="M105 136 L31 132"/>
              <path d="M105 152 L35 151"/>
              <path d="M105 168 L42 172"/>
              <path d="M105 184 L52 193"/>
              <path d="M105 200 L68 213"/>
            </g>

            <g stroke="#73ae4a" stroke-width="3.2" stroke-linecap="round">
              <path d="M115 35 L148 27"/>
              <path d="M115 48 L164 38"/>
              <path d="M115 62 L176 49"/>
              <path d="M115 76 L184 63"/>
              <path d="M115 90 L190 79"/>
              <path d="M115 105 L193 96"/>
              <path d="M115 120 L195 114"/>
              <path d="M115 136 L193 132"/>
              <path d="M115 152 L189 151"/>
              <path d="M115 168 L181 172"/>
              <path d="M115 184 L170 193"/>
              <path d="M115 200 L154 213"/>
            </g>

            <path
              d="M194 85 L180 92 L194 98
                 M195 122 L178 130 L193 137
                 M190 160 L171 169 L185 177
                 M177 194 L160 204 L169 214"
              fill="none"
              stroke="#357f32"
              stroke-width="4"
              stroke-linecap="round"
              stroke-linejoin="round"
            />

            <path
              d="M110 232 L88 258"
              stroke="#408b33"
              stroke-width="12"
              stroke-linecap="round"
            />

            <path
              d="M110 232 L88 258"
              stroke="#78bd52"
              stroke-width="3"
              stroke-linecap="round"
            />
          </svg>
        `,

        "incense": `
          <svg viewBox="0 0 200 200" width="150" height="150" aria-label="ธูปปักในกระถางธูป">
            <path d="M67 124 L53 42" stroke="#9b6d45" stroke-width="7" stroke-linecap="round"/>
            <path d="M100 124 L100 30" stroke="#9b6d45" stroke-width="7" stroke-linecap="round"/>
            <path d="M133 124 L148 43" stroke="#9b6d45" stroke-width="7" stroke-linecap="round"/>

            <path d="M50 38 C41 27, 58 20, 52 9"
              fill="none" stroke="#cfcfcf" stroke-width="5" stroke-linecap="round"/>
            <path d="M100 25 C91 15, 108 10, 101 1"
              fill="none" stroke="#cfcfcf" stroke-width="5" stroke-linecap="round"/>
            <path d="M151 39 C161 27, 144 19, 151 8"
              fill="none" stroke="#cfcfcf" stroke-width="5" stroke-linecap="round"/>

            <ellipse cx="100" cy="128" rx="48" ry="15"
              fill="#d49a62" stroke="#925f39" stroke-width="5"/>
            <path d="M55 129 L65 169 Q100 185 135 169 L145 129"
              fill="#efa968" stroke="#925f39" stroke-width="5"/>
            <ellipse cx="100" cy="129" rx="44" ry="11" fill="#6d4b39"/>

            <circle cx="84" cy="141" r="4" fill="#ffcf87"/>
            <circle cx="112" cy="151" r="4" fill="#ffcf87"/>
            <circle cx="123" cy="139" r="3" fill="#ffcf87"/>
          </svg>
        `
      };

      return pictures[type] || type;
    }

    function sparkle() {
      const icons = ["⭐", "✨", "🌟", "💛"];

      for (let i = 0; i < 16; i++) {
        const star = document.createElement("span");
        star.className = "sparkle";
        star.textContent = icons[Math.floor(Math.random() * icons.length)];
        star.style.left = (15 + Math.random() * 70) + "vw";
        star.style.top = (8 + Math.random() * 25) + "vh";
        star.style.fontSize = (20 + Math.random() * 23) + "px";

        document.body.appendChild(star);
        setTimeout(() => star.remove(), 1300);
      }
    }

    function renderQuestion() {
      answered = false;
      messageEl.textContent = "";
      nextButton.style.display = "none";

      const item = questions[current];

      pictureEl.innerHTML = getPicture(item.picture);
      questionEl.textContent = item.question;
      levelEl.textContent = `ข้อ ${current + 1} จาก ${questions.length}`;
      speechEl.textContent = "ลองดูภาพดี ๆ แล้วเลือกคำตอบนะ!";

      answersEl.innerHTML = "";

      item.choices.forEach((choice, index) => {
        const button = document.createElement("button");
        button.className = "answer";
        button.textContent = choice;
        button.onclick = () => checkAnswer(index, button);

        answersEl.appendChild(button);
      });
    }

    function checkAnswer(selected, button) {
      if (answered) return;

      answered = true;

      const item = questions[current];
      const buttons = document.querySelectorAll(".answer");

      buttons.forEach(btn => btn.disabled = true);

      if (selected === item.answer) {
        button.classList.add("correct");
        score++;
        scoreEl.textContent = score;
        messageEl.textContent = "🎉 ถูกต้อง! ได้ดาว 1 ดวง";
        speechEl.textContent = "เยี่ยมมาก! โมจิดีใจจังเลย!";
        sparkle();
      } else {
        button.classList.add("wrong");
        buttons[item.answer].classList.add("correct");
        messageEl.textContent = "💛 ไม่เป็นไรนะ คำตอบที่ถูกคือปุ่มสีเขียว";
        speechEl.textContent = "ลองจำคำตอบไว้ แล้วไปข้อต่อไปกัน!";
      }

      nextButton.textContent = current === questions.length - 1
        ? "ดูคะแนนของฉัน ⭐"
        : "ข้อต่อไป ➜";

      nextButton.style.display = "inline-block";
    }

    nextButton.onclick = () => {
      current++;

      if (current < questions.length) {
        renderQuestion();
      } else {
        document.getElementById("quizCard").style.display = "none";
        document.querySelector(".hero").style.display = "none";
        document.getElementById("result").style.display = "block";

        document.getElementById("resultText").textContent =
          `หนูเก็บดาวได้ ${score} จาก ${questions.length} ดวง`;

        sparkle();
      }
    };

    function restartGame() {
      current = 0;
      score = 0;
      scoreEl.textContent = "0";

      document.getElementById("result").style.display = "none";
      document.getElementById("quizCard").style.display = "block";
      document.querySelector(".hero").style.display = "flex";

      renderQuestion();
    }

    renderQuestion();
  </script>
</body>
</html>
