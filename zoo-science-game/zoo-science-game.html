<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ผจญภัยสวนสัตว์วิทย์จิ๋ว</title>

  <style>
    :root {
      --green: #239555;
      --dark-green: #125d35;
      --light-green: #dff5cf;
      --yellow: #ffd84a;
      --orange: #ff9e3d;
      --blue: #45b5ee;
      --red: #ef6262;
      --cream: #fffbed;
      --text: #244332;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Arial Rounded MT Bold", "Noto Sans Thai", Tahoma, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 8%, #fff 0 3%, transparent 3.5%),
        radial-gradient(circle at 85% 14%, #fff 0 4%, transparent 4.5%),
        linear-gradient(#8edcff 0 30%, #91d769 30% 100%);
    }

    .app {
      width: min(100%, 960px);
      min-height: 100vh;
      margin: auto;
      padding: max(16px, env(safe-area-inset-top)) 18px max(24px, env(safe-area-inset-bottom));
    }

    .hidden {
      display: none !important;
    }

    .start-screen,
    .end-screen,
    .game-card {
      background: var(--cream);
      border: 6px solid #fff;
      border-radius: 30px;
      box-shadow: 0 8px 0 #59aa50;
    }

    .start-screen,
    .end-screen {
      max-width: 760px;
      margin: 7vh auto;
      padding: clamp(28px, 6vw, 55px);
      text-align: center;
    }

    h1 {
      margin: 10px 0;
      color: var(--dark-green);
      font-size: clamp(31px, 6vw, 52px);
    }

    .start-screen p,
    .end-screen p {
      font-size: clamp(18px, 3vw, 25px);
      line-height: 1.65;
    }

    .zoo-animals {
      font-size: clamp(43px, 8vw, 75px);
      margin-bottom: 10px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 12px 18px;
      margin-bottom: 12px;
      border-radius: 22px;
      background: #ffffffdd;
      box-shadow: 0 5px 0 #5baa49;
    }

    .logo {
      color: var(--dark-green);
      font-size: clamp(19px, 3vw, 29px);
      font-weight: 900;
    }

    .score {
      white-space: nowrap;
      padding: 8px 13px;
      border-radius: 15px;
      background: #fff3bd;
      font-size: clamp(16px, 2.5vw, 22px);
      font-weight: 900;
    }

    .progress-box {
      height: 18px;
      overflow: hidden;
      margin-bottom: 14px;
      border: 2px solid #fff;
      border-radius: 99px;
      background: #ffffffb8;
    }

    .progress {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #ffd742, #ff9e36);
      transition: width 0.35s ease;
    }

    .game-card {
      min-height: 75vh;
      padding: clamp(20px, 4vw, 38px);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .game-card::before,
    .game-card::after {
      content: "🌿";
      position: absolute;
      z-index: 0;
      opacity: 0.28;
      font-size: 68px;
    }

    .game-card::before {
      top: 0;
      left: 0;
      transform: rotate(-25deg);
    }

    .game-card::after {
      right: 0;
      bottom: 0;
      transform: rotate(25deg);
    }

    .content {
      position: relative;
      z-index: 1;
    }

    .zone {
      display: inline-block;
      padding: 8px 16px;
      border-radius: 99px;
      background: var(--light-green);
      color: var(--dark-green);
      font-size: clamp(15px, 2.3vw, 20px);
      font-weight: 900;
    }

    .animal {
      margin: 10px 0 5px;
      font-size: clamp(55px, 10vw, 90px);
      line-height: 1;
    }

    .counter {
      color: #59715f;
      font-size: clamp(15px, 2vw, 18px);
      font-weight: bold;
    }

    .visual {
      max-width: 620px;
      margin: 16px auto;
      padding: 10px;
      border: 3px dashed var(--blue);
      border-radius: 20px;
      background: #e8f7ff;
    }

    .visual img {
      display: block;
      width: 100%;
      max-height: 310px;
      object-fit: contain;
      border-radius: 14px;
    }

    .visual small {
      display: block;
      margin-top: 7px;
      color: #356b83;
      font-size: 16px;
      font-weight: bold;
    }

    .question {
      max-width: 780px;
      margin: 18px auto;
      font-size: clamp(22px, 3.7vw, 34px);
      line-height: 1.48;
      font-weight: 900;
    }

    .answers {
      display: grid;
      gap: 12px;
      max-width: 730px;
      margin: auto;
    }

    button {
      font-family: inherit;
      font-weight: 900;
      cursor: pointer;
      touch-action: manipulation;
      border: none;
      transition: transform 0.12s ease, filter 0.12s ease;
    }

    button:active {
      transform: translateY(3px);
    }

    .answer-btn {
      width: 100%;
      min-height: 68px;
      padding: 14px 18px;
      border: 3px solid #d2ead0;
      border-radius: 20px;
      box-shadow: 0 4px 0 #add6a7;
      background: #fff;
      color: var(--text);
      text-align: left;
      font-size: clamp(18px, 2.8vw, 25px);
    }

    .answer-btn:hover {
      filter: brightness(0.98);
    }

    .answer-btn.correct {
      background: #c5f5bb;
      border-color: #45ad53;
    }

    .answer-btn.wrong {
      background: #ffd4cf;
      border-color: var(--red);
    }

    .message {
      display: none;
      max-width: 700px;
      margin: 18px auto 0;
      padding: 16px;
      border-radius: 19px;
      font-size: clamp(18px, 2.6vw, 24px);
      font-weight: 900;
    }

    .message.good {
      display: block;
      background: #d1f7ca;
      color: #176c39;
    }

    .message.try {
      display: block;
      background: #ffe0da;
      color: #a73b31;
    }

    .action-btn {
      margin-top: 18px;
      padding: 13px 22px;
      border-radius: 18px;
      color: #fff;
      background: var(--blue);
      box-shadow: 0 4px 0 #267fb7;
      font-size: clamp(17px, 2.5vw, 22px);
    }

    .start-btn {
      background: var(--orange);
      box-shadow: 0 5px 0 #c66c20;
      font-size: clamp(21px, 3.2vw, 28px);
    }

    .next-btn {
      background: var(--green);
      box-shadow: 0 4px 0 #176d3b;
    }

    .listen-row {
      margin-top: 15px;
    }

    @media (max-width: 480px) {
      .topbar {
        padding: 10px 12px;
      }

      .game-card {
        padding: 18px 12px;
      }

      .answer-btn {
        min-height: 62px;
      }
    }
  </style>
</head>

<body>
  <main class="app">

    <section id="startScreen" class="start-screen">
      <div class="zoo-animals">🦁 🐼 🦒 🐘 🦦</div>
      <h1>ผจญภัยสวนสัตว์วิทย์จิ๋ว</h1>
      <p>
        ช่วยเพื่อนสัตว์ตอบคำถามวิทยาศาสตร์<br>
        ตอบถูก รับดาวอุ้งเท้า ⭐🐾
      </p>
      <button class="action-btn start-btn" onclick="startGame()">
        เริ่มผจญภัย! 🚀
      </button>
    </section>

    <section id="gameScreen" class="hidden">
      <header class="topbar">
        <div class="logo">🦁 สวนสัตว์วิทย์จิ๋ว</div>
        <div class="score">⭐ <span id="stars">0</span> ดาว</div>
      </header>

      <div class="progress-box">
        <div id="progress" class="progress"></div>
      </div>

      <article class="game-card">
        <div class="content">
          <div id="zone" class="zone"></div>
          <div id="animal" class="animal"></div>
          <div id="counter" class="counter"></div>
          <div id="visual" class="visual hidden"></div>
          <div id="question" class="question"></div>
          <div id="answers" class="answers"></div>
          <div id="message" class="message"></div>
          <div id="nextArea"></div>

          <div class="listen-row">
            <button class="action-btn" onclick="speakQuestion()">
              🔊 ฟังคำถาม
            </button>
          </div>
        </div>
      </article>
    </section>

    <section id="endScreen" class="end-screen hidden">
      <div class="zoo-animals">🎉 🦁 🐼 🦒 🐘 🦦 🎉</div>
      <h1>เก่งมาก นักวิทย์น้อย!</h1>
      <p id="resultText"></p>
      <p id="awardText"></p>
      <button class="action-btn start-btn" onclick="startGame()">
        เล่นอีกครั้ง 🔄
      </button>
    </section>

  </main>

    let current = 0;
    let stars = 0;
    let answered = false;

    function startGame() {
      current = 0;
      stars = 0;
      answered = false;

      document.getElementById("startScreen").classList.add("hidden");
      document.getElementById("endScreen").classList.add("hidden");
      document.getElementById("gameScreen").classList.remove("hidden");

      renderQuestion();
    }

    function renderQuestion() {
      answered = false;

      const item = questions[current];
      const visual = document.getElementById("visual");
      const answers = document.getElementById("answers");
      const message = document.getElementById("message");

      document.getElementById("zone").textContent = item.zone;
      document.getElementById("animal").textContent = item.animal;
      document.getElementById("counter").textContent = `ข้อ ${current + 1} จาก ${questions.length}`;
      document.getElementById("question").textContent = item.q;
      document.getElementById("stars").textContent = stars;
      document.getElementById("progress").style.width = `${(current / questions.length) * 100}%`;

      if (item.visual) {
        visual.innerHTML = item.visual;
        visual.classList.remove("hidden");
      } else {
        visual.innerHTML = "";
        visual.classList.add("hidden");
      }

      answers.innerHTML = "";
      message.className = "message";
      message.textContent = "";
      document.getElementById("nextArea").innerHTML = "";

      item.choices.forEach((choice, index) => {
        const button = document.createElement("button");
        button.className = "answer-btn";
        button.innerHTML = `<strong>${["①", "②", "③"][index]}</strong> ${choice}`;
        button.onclick = () => checkAnswer(index, button);
        answers.appendChild(button);
      });
    }

    function checkAnswer(selected, button) {
      if (answered) return;

      const item = questions[current];
      const message = document.getElementById("message");

      if (selected === item.answer) {
        answered = true;
        stars++;

        button.classList.add("correct");
        document.getElementById("stars").textContent = stars;

        message.className = "message good";
        message.innerHTML = `🎉 เก่งมาก! ${item.explain}<br>ได้รับดาวอุ้งเท้า 1 ดวง ⭐🐾`;

        speak(`เก่งมาก ${item.explain}`);

        const nextText = current === questions.length - 1
          ? "ดูผลการผจญภัย 🏆"
          : "ไปช่วยเพื่อนตัวต่อไป ➜";

        document.getElementById("nextArea").innerHTML = `
          <button class="action-btn next-btn" onclick="nextQuestion()">
            ${nextText}
          </button>
        `;
      } else {
        button.classList.add("wrong");
        message.className = "message try";
        message.textContent = "💡 ลองคิดอีกนิดนะ! นักวิทย์น้อยทำได้แน่นอน";
        speak("ลองคิดอีกนิดนะ");

        setTimeout(() => {
          button.classList.remove("wrong");
          message.className = "message";
        }, 1200);
      }
    }

    function nextQuestion() {
      current++;

      if (current >= questions.length) {
        showResult();
      } else {
        renderQuestion();
      }
    }

    function showResult() {
      document.getElementById("gameScreen").classList.add("hidden");
      document.getElementById("endScreen").classList.remove("hidden");

      let award = "";

      if (stars >= 35) {
        award = "🏆 รางวัล: แชมป์พิทักษ์สวนสัตว์!";
      } else if (stars >= 25) {
        award = "🦁 รางวัล: เหรียญนักวิทย์สวนสัตว์!";
      } else if (stars >= 15) {
        award = "🌟 รางวัล: เพื่อนสัตว์นักสังเกต!";
      } else {
        award = "🌱 รางวัล: นักเรียนรู้จิ๋ว ลองเล่นอีกครั้งเพื่อเก็บดาวเพิ่มนะ!";
      }

      document.getElementById("resultText").innerHTML =
        `หนูเก็บได้ <strong>${stars} ดาวอุ้งเท้า จาก ${questions.length} ดาว</strong> ⭐🐾`;

      document.getElementById("awardText").textContent = award;

      speak(`เก่งมาก หนูได้ ${stars} ดาว`);
    }

    function speakQuestion() {
      const item = questions[current];
      const text = `${item.q} ข้อหนึ่ง ${item.choices[0]} ข้อสอง ${item.choices[1]} ข้อสาม ${item.choices[2]}`;
      speak(text);
    }

    function speak(text) {
      if (!("speechSynthesis" in window)) return;

      window.speechSynthesis.cancel();

      const voice = new SpeechSynthesisUtterance(text);
      voice.lang = "th-TH";
      voice.rate = 0.82;

      window.speechSynthesis.speak(voice);
    }
  </script>
